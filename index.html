<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CyberShield</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS file link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🔐 CyberShield</h1>
      <p>Password Strength & URL Safety Analyzer</p>
    </div>

    <div class="grid">
      <!-- Password -->
      <div class="card">
        <h3>Password Strength Checker</h3>
        <input type="password" id="password" placeholder="Enter password (min 8 chars)">
        
        <div class="row">
          <input type="checkbox" id="showPwd">
          <label for="showPwd">Show password</label>
        </div>

        <div class="meter"><div class="meter-fill" id="meterFill"></div></div>
        <button id="checkPasswordBtn">Check Password</button>
        <div class="result" id="passResult"></div>
      </div>

      <!-- URL -->
      <div class="card">
        <h3>URL Safety Checker</h3>
        <input type="text" id="url" placeholder="Paste full URL (https://...)">
        <button id="checkUrlBtn">Check URL</button>
        <div class="result" id="urlResult"></div>
      </div>
    </div>
  </div>

  <!-- JS file link -->
  <script src="script.js"></script>
</body>
</html>
